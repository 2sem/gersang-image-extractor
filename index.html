<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거상 이미지 Viewer</title>
    <style>
        :root {
            --bg: #15130f;
            --surface: #201c16;
            --surface-hover: #2a251d;
            --border: #3c352a;
            --border-soft: #2c271f;
            --accent: #e0a83e;
            --accent-dim: #8a6a2c;
            --text: #f1ead9;
            --text-muted: #a89a80;
            --error: #e0664f;
            --error-bg: #3a201a;
            --font-display: Georgia, 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
            --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Noto Sans Mono CJK KR', monospace;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f6f1e6;
                --surface: #ffffff;
                --surface-hover: #f0e9d8;
                --border: #ddd0b0;
                --border-soft: #e8dfc7;
                --accent: #a9711a;
                --accent-dim: #c99a45;
                --text: #2a2418;
                --text-muted: #7a6e56;
                --error: #b3392a;
                --error-bg: #fbe6e1;
            }
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 28px 32px 60px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 14px;
        }
        h1 {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 28px;
            letter-spacing: 0.02em;
            margin: 0 0 4px;
            color: var(--text);
        }
        h1::after {
            content: '';
            display: block;
            width: 48px;
            height: 3px;
            margin-top: 10px;
            background: var(--accent);
        }
        #statusMessage {
            min-height: 20px;
            margin: 16px 0 20px;
            padding: 0;
            font-size: 13px;
            color: var(--text-muted);
            transition: color 0.15s ease;
        }
        #statusMessage:not(:empty) {
            padding: 8px 14px;
            border: 1px solid var(--border-soft);
            border-left: 3px solid var(--accent-dim);
            background: var(--surface);
            border-radius: 3px;
        }
        #statusMessage.error {
            color: var(--error);
            border-left-color: var(--error);
            background: var(--error-bg);
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-soft);
            margin-bottom: 24px;
        }
        input[type="file"] {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-muted);
        }
        input[type="file"]::file-selector-button {
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 7px 14px;
            margin-right: 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        input[type="file"]::file-selector-button:hover {
            border-color: var(--accent);
            background: var(--surface-hover);
        }
        .toolbar-divider {
            width: 1px;
            height: 20px;
            background: var(--border-soft);
        }
        .skip-blank-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }
        .skip-blank-label input[type="checkbox"] {
            accent-color: var(--accent);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        button {
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
        }
        button:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }
        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        #exportSelected, #exportAll {
            background: transparent;
            border-color: var(--accent-dim);
        }
        #exportSelected:hover:not(:disabled), #exportAll:hover:not(:disabled) {
            background: var(--accent-dim);
            color: var(--bg);
            border-color: var(--accent-dim);
        }
        .image-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
            gap: 14px;
        }
        .image-item {
            position: relative;
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            background: var(--surface);
            padding: 10px;
            text-align: center;
            transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        }
        .image-item:hover {
            border-color: var(--border);
            transform: translateY(-2px);
        }
        .image-item:has(input[type="checkbox"]:checked) {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 4px 14px -4px var(--accent-dim);
        }
        .image-item input[type="checkbox"] {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 15px;
            height: 15px;
            accent-color: var(--accent);
            cursor: pointer;
            z-index: 1;
        }
        .image-item label {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 11px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .image-item img {
            display: block;
            margin: 18px auto 0;
            max-width: 100%;
            cursor: pointer;
        }
        #gifPreviewContainer {
            display: none;
            margin-bottom: 24px;
            padding: 16px;
            border: 1px solid var(--border-soft);
            border-radius: 4px;
            background: var(--surface);
            text-align: center;
        }
        #gifPreviewImage {
            display: inline-block;
            width: min(220px, 100%);
            height: auto;
            image-rendering: pixelated;
            background-image:
                linear-gradient(45deg, #80808022 25%, transparent 25%),
                linear-gradient(-45deg, #80808022 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #80808022 75%),
                linear-gradient(-45deg, transparent 75%, #80808022 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
        #gifPreviewCaption {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .page-footer {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid var(--border-soft);
            font-size: 12px;
            color: var(--text-muted);
        }
        .page-footer a {
            color: var(--accent);
            text-decoration: none;
        }
        .page-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>거상 이미지 Viewer</h1>
    <div id="statusMessage"></div>
    <div class="toolbar">
        <input type="file" id="fileInput" accept=".s32,.agf">
        <div class="toolbar-divider"></div>
        <label class="skip-blank-label"><input type="checkbox" id="skipBlankToggle" checked> 빈 이미지 건너뛰기</label>
        <div class="toolbar-divider"></div>
        <label class="skip-blank-label"><input type="checkbox" id="animationModeToggle"> 애니메이션(GIF)로 보기</label>
        <div class="toolbar-divider"></div>
        <button id="selectAllToggle" disabled>전체 선택/해제</button>
        <button id="exportSelected" disabled>선택한 이미지 내보내기</button>
        <button id="exportAll" disabled>전체 내보내기</button>
    </div>
    <div id="gifPreviewContainer">
        <img id="gifPreviewImage" alt="애니메이션 미리보기">
        <div id="gifPreviewCaption"></div>
    </div>
    <div class="image-container" id="imageContainer"></div>
    <footer class="page-footer">
        기여 안내 · <a href="https://github.com/2sem/gersang-image-extractor" target="_blank" rel="noopener">GitHub 저장소</a>에서 소스 코드 확인, 버그 제보(Issue), 개선 제안 및 Pull Request를 환영합니다.
    </footer>
    <script>
        const fileInput = document.getElementById('fileInput');
        const imageContainer = document.getElementById('imageContainer');
        const exportSelectedButton = document.getElementById('exportSelected');
        const exportAllButton = document.getElementById('exportAll');
        const selectAllToggleButton = document.getElementById('selectAllToggle');
        const skipBlankToggle = document.getElementById('skipBlankToggle');
        const animationModeToggle = document.getElementById('animationModeToggle');
        const gifPreviewContainer = document.getElementById('gifPreviewContainer');
        const gifPreviewImage = document.getElementById('gifPreviewImage');
        const gifPreviewCaption = document.getElementById('gifPreviewCaption');
        const statusMessage = document.getElementById('statusMessage');

        let currentBuffer = null;

        // Populated when animationModeToggle is checked and a file is loaded: the
        // shown frames' full-canvas RGBA buffers (for on-demand GIF export) and their
        // already-rendered data URLs (for the live preview, which just cycles through
        // the original frames — no GIF encoding happens until export is clicked).
        let currentAnimationFrames = null;
        let currentAnimationFrameDataUrls = null;
        let currentAnimationWidth = 0;
        let currentAnimationHeight = 0;
        let gifPreviewIntervalId = null;

        const GIF_PREVIEW_INTERVAL_MS = 100;
        const GIF_FRAME_DELAY_CS = 10; // 100ms per frame, matches the preview's pace

        // `.image-item`s are rendered in the same order currentAnimationFrames /
        // currentAnimationFrameDataUrls were built in, so a checkbox's DOM position
        // is directly usable as an index into either array.
        function getSelectedFrameIndices() {
            const checkboxes = Array.from(document.querySelectorAll('.image-item input[type="checkbox"]'));
            const indices = [];
            checkboxes.forEach((cb, idx) => { if (cb.checked) indices.push(idx); });
            return indices;
        }

        // Some AGF files bundle multiple animations (idle, walk, attack, ...) as one
        // frame sequence. Selecting specific frames lets the user build a GIF from
        // just one of those sub-animations; with nothing selected, the preview (and
        // "전체 내보내기") falls back to every currently-shown frame.
        function updateGifPreviewForSelection() {
            if (!currentAnimationFrameDataUrls || currentAnimationFrameDataUrls.length === 0) {
                stopGifPreview();
                return;
            }
            const selected = getSelectedFrameIndices();
            const dataUrls = selected.length > 0
                ? selected.map(idx => currentAnimationFrameDataUrls[idx])
                : currentAnimationFrameDataUrls;
            startGifPreview(dataUrls, selected.length > 0);
        }

        function startGifPreview(dataUrls, isSelection) {
            stopGifPreview();
            gifPreviewContainer.style.display = 'block';
            const label = isSelection
                ? `선택한 ${dataUrls.length}개 프레임 미리보기`
                : `전체 ${dataUrls.length}프레임 미리보기`;
            gifPreviewCaption.textContent = `${label} (내보내기 시 GIF로 저장됩니다)`;
            let frameIndex = 0;
            gifPreviewImage.src = dataUrls[0];
            gifPreviewIntervalId = setInterval(() => {
                frameIndex = (frameIndex + 1) % dataUrls.length;
                gifPreviewImage.src = dataUrls[frameIndex];
            }, GIF_PREVIEW_INTERVAL_MS);
        }

        function stopGifPreview() {
            if (gifPreviewIntervalId !== null) {
                clearInterval(gifPreviewIntervalId);
                gifPreviewIntervalId = null;
            }
            gifPreviewContainer.style.display = 'none';
            gifPreviewImage.removeAttribute('src');
        }

        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.image-item input[type="checkbox"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => { cb.checked = !allChecked; });
            if (animationModeToggle.checked) {
                updateGifPreviewForSelection();
            }
        }

        let currentFileName = '';

        function showError(message) {
            statusMessage.textContent = message;
            statusMessage.classList.add('error');
        }

        function showInfo(message) {
            statusMessage.textContent = message;
            statusMessage.classList.remove('error');
        }

        function clearStatus() {
            statusMessage.textContent = '';
            statusMessage.classList.remove('error');
        }

        fileInput.addEventListener('change', handleFileSelect);
        exportSelectedButton.addEventListener('click', exportSelectedImages);
        exportAllButton.addEventListener('click', exportAllImages);
        selectAllToggleButton.addEventListener('click', toggleSelectAll);
        skipBlankToggle.addEventListener('change', () => {
            if (currentBuffer) {
                parseSpriteFile(currentBuffer);
            }
        });
        animationModeToggle.addEventListener('change', () => {
            if (currentBuffer) {
                parseSpriteFile(currentBuffer);
            }
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            currentFileName = file.name;
            showInfo(`${file.name} 불러오는 중...`);

            const reader = new FileReader();
            reader.onload = function(e) {
                currentBuffer = e.target.result;
                parseSpriteFile(currentBuffer);
            };
            reader.readAsArrayBuffer(file);
        }

        // 거상(Gersang) sprite container family. Both formats share a 16-byte header
        // (u32 signature, u32 width, u32 height, u32 frameCount) and a frame-offset
        // table at the same fixed offset 0x4c0 (1216) — AGF is the newer replacement
        // for S32, adding a per-frame trim box and whole-region zlib compression.
        // Layout cross-checked against the independent reference decoder at
        // https://github.com/hallazzang/gosang (sprite32alpha.go) for the S32 side;
        // the AGF side was reverse-engineered directly against real client assets.
        const FRAME_OFFSETS_OFFSET = 1216; // 0x4c0 — shared by both formats

        // S32 — 32-bit color with alpha (sibling variants 0x0F no-alpha, 0x09 8-bit
        // palette exist but aren't supported).
        //   offset 0x970 (2416) : u32[frameCount] frame pixel-op record count
        //   offset 0xe4c (3660) : frame pixel-op streams begin here (uncompressed)
        // Both tables reserve a fixed 1200-byte block (up to 300 frames) regardless
        // of the actual frameCount, which is why offsets are fixed constants rather
        // than derived from frameCount.
        const S32_SIGNATURE_ALPHA32 = 25; // 0x19
        const S32_FRAME_RECORD_COUNTS_OFFSET = 2416; // 0x970
        const S32_FRAME_DATA_BASE = 3660; // 0xe4c

        // AGF — same per-frame pixel-op format as S32, but each frame is trimmed to
        // a bounding box within the canvas, and the *entire* frame-data region (all
        // frames concatenated, addressed the same way S32 addresses it) is stored as
        // a single zlib stream.
        //   offset 2416 : { u16 x, u16 y, u16 w, u16 h }[frameCount] — per-frame trim box
        //   right after that table: a 48-byte trailer —
        //     u32 decompressedSize, u32 w*10, u32 h*10, u32 0, u32 w, u32 h,
        //     u32 w*10, u32 h*10, u32 0, u32 0, u32 flag, u32 compressedSize
        //   then the zlib stream itself, `compressedSize` bytes long
        const AGF_SIGNATURE = 35; // 0x23
        const AGF_FRAME_BBOX_OFFSET = 2416; // coincides with S32's offset, different meaning
        const AGF_TRAILER_SIZE = 48;

        // Reads an S32 sprite's header-described frames without any decompression —
        // pixel-op data sits uncompressed at a fixed offset in the file.
        function readS32Sprite(dataView, buffer, width, height, frameCount) {
            if (buffer.byteLength < S32_FRAME_RECORD_COUNTS_OFFSET) {
                throw new Error('파일이 너무 작습니다. 올바른 S32 파일이 아닙니다.');
            }
            const tableEnd = Math.max(
                FRAME_OFFSETS_OFFSET + frameCount * 4,
                S32_FRAME_RECORD_COUNTS_OFFSET + frameCount * 4
            );
            if (frameCount < 0 || buffer.byteLength < tableEnd) {
                throw new Error('이미지 개수 정보가 올바르지 않습니다. 올바른 S32 파일이 아닙니다.');
            }

            const offsets = [];
            const recordCounts = [];
            for (let i = 0; i < frameCount; i++) {
                offsets.push(dataView.getUint32(FRAME_OFFSETS_OFFSET + i * 4, true) + S32_FRAME_DATA_BASE);
                recordCounts.push(dataView.getUint32(S32_FRAME_RECORD_COUNTS_OFFSET + i * 4, true));
            }

            return {
                width, height, frameCount,
                getFrame(i) {
                    const pixels = decompressPixels(dataView, offsets[i], recordCounts[i], width, height);
                    return { pixels, isBlank: pixels.isBlank, x: 0, y: 0, w: width, h: height };
                },
            };
        }

        // Inflates a zlib (RFC1950) byte stream using the browser's native decoder —
        // no external library needed.
        async function inflateZlib(bytes) {
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
            const arrayBuffer = await new Response(stream).arrayBuffer();
            return new Uint8Array(arrayBuffer);
        }

        // Reads an AGF sprite: per-frame trim boxes, then one zlib-decompresses the
        // whole frame-data region up front so individual frames can be sliced out
        // synchronously afterward (offsets are relative to the decompressed buffer).
        async function readAGFSprite(dataView, buffer, width, height, frameCount) {
            const bboxTableEnd = AGF_FRAME_BBOX_OFFSET + frameCount * 8;
            const trailerEnd = bboxTableEnd + AGF_TRAILER_SIZE;
            if (frameCount < 0 || buffer.byteLength < trailerEnd) {
                throw new Error('이미지 개수 정보가 올바르지 않습니다. 올바른 AGF 파일이 아닙니다.');
            }

            const offsets = [];
            const bboxes = [];
            for (let i = 0; i < frameCount; i++) {
                offsets.push(dataView.getUint32(FRAME_OFFSETS_OFFSET + i * 4, true));
                bboxes.push({
                    x: dataView.getUint16(AGF_FRAME_BBOX_OFFSET + i * 8, true),
                    y: dataView.getUint16(AGF_FRAME_BBOX_OFFSET + i * 8 + 2, true),
                    w: dataView.getUint16(AGF_FRAME_BBOX_OFFSET + i * 8 + 4, true),
                    h: dataView.getUint16(AGF_FRAME_BBOX_OFFSET + i * 8 + 6, true),
                });
            }

            const decompressedSize = dataView.getUint32(bboxTableEnd, true);
            const compressedSize = dataView.getUint32(bboxTableEnd + 44, true);
            const dataBase = trailerEnd;
            if (buffer.byteLength < dataBase + compressedSize) {
                throw new Error('압축된 이미지 데이터 크기가 올바르지 않습니다. 올바른 AGF 파일이 아닙니다.');
            }

            const compressedBytes = new Uint8Array(buffer, dataBase, compressedSize);
            const decompressed = await inflateZlib(compressedBytes);
            if (decompressed.length !== decompressedSize) {
                throw new Error('압축 해제된 이미지 데이터 크기가 일치하지 않습니다.');
            }
            const decompressedView = new DataView(decompressed.buffer, decompressed.byteOffset, decompressed.byteLength);

            return {
                width, height, frameCount,
                getFrame(i) {
                    const { x, y, w, h } = bboxes[i];
                    if (w === 0 || h === 0) {
                        const empty = new Uint8ClampedArray(0);
                        empty.isBlank = true;
                        return { pixels: empty, isBlank: true, x, y, w: 0, h: 0 };
                    }
                    const start = offsets[i];
                    const end = i < frameCount - 1 ? offsets[i + 1] : decompressedSize;
                    const pixels = decompressPixels(decompressedView, start, (end - start) / 4, w, h);
                    return { pixels, isBlank: pixels.isBlank, x, y, w, h };
                },
            };
        }

        async function parseSpriteFile(buffer) {
            imageContainer.innerHTML = '';
            exportSelectedButton.disabled = true;
            exportAllButton.disabled = true;
            selectAllToggleButton.disabled = true;
            stopGifPreview();
            currentAnimationFrames = null;
            currentAnimationFrameDataUrls = null;
            clearStatus();

            try {
                if (buffer.byteLength < 16) {
                    throw new Error('파일이 너무 작습니다. 올바른 S32/AGF 파일이 아닙니다.');
                }

                const dataView = new DataView(buffer);
                const signature = dataView.getUint32(0, true);
                const width = dataView.getUint32(4, true);
                const height = dataView.getUint32(8, true);
                const frameCount = dataView.getUint32(12, true);
                console.log("[Log] 파일 종류:", signature, "넓이:", width, "높이:", height, "이미지 수:", frameCount);

                if (width === 0 || height === 0) {
                    throw new Error('이미지 크기 정보가 올바르지 않습니다. 올바른 S32/AGF 파일이 아닙니다.');
                }

                let sprite;
                if (signature === S32_SIGNATURE_ALPHA32) {
                    sprite = readS32Sprite(dataView, buffer, width, height, frameCount);
                } else if (signature === AGF_SIGNATURE) {
                    sprite = await readAGFSprite(dataView, buffer, width, height, frameCount);
                } else {
                    throw new Error(`지원하지 않는 스프라이트 형식입니다 (signature=0x${signature.toString(16)}). S32(0x19) 또는 AGF(0x23) 파일만 지원합니다.`);
                }

                const wantAnimationFrames = animationModeToggle.checked;
                const animationFrames = wantAnimationFrames ? [] : null;
                const animationFrameDataUrls = wantAnimationFrames ? [] : null;

                let renderedCount = 0;
                for (let i = 0; i < sprite.frameCount; i++) {
                    const frame = sprite.getFrame(i);
                    console.log(`[Log] ${i + 1}번째 이미지 추출 완료 (bbox: ${frame.x},${frame.y} ${frame.w}x${frame.h})`);

                    if (skipBlankToggle.checked && frame.isBlank) {
                        console.log(`[Log] ${i + 1}번째 이미지 건너뜀 (빈 이미지)`);
                        continue;
                    }

                    const canvas = renderFrameCanvas(frame.pixels, frame.w, frame.h, sprite.width, sprite.height, frame.x, frame.y);
                    const dataUrl = canvas.toDataURL();
                    addImageToContainer(i + 1, dataUrl);
                    renderedCount++;

                    if (wantAnimationFrames) {
                        animationFrameDataUrls.push(dataUrl);
                        animationFrames.push(canvas.getContext('2d').getImageData(0, 0, sprite.width, sprite.height).data);
                    }
                }

                let statusExtra = '';
                if (wantAnimationFrames && animationFrames.length > 0) {
                    currentAnimationFrames = animationFrames;
                    currentAnimationFrameDataUrls = animationFrameDataUrls;
                    currentAnimationWidth = sprite.width;
                    currentAnimationHeight = sprite.height;
                    updateGifPreviewForSelection();
                    statusExtra = ` / 애니메이션 미리보기 ${animationFrames.length}프레임 (이미지를 선택하면 선택한 프레임만으로 GIF를 만들 수 있습니다)`;
                } else if (wantAnimationFrames) {
                    statusExtra = ' / 애니메이션으로 표시할 프레임이 없습니다';
                }

                exportSelectedButton.disabled = renderedCount === 0;
                exportAllButton.disabled = renderedCount === 0;
                selectAllToggleButton.disabled = renderedCount === 0;
                showInfo((renderedCount === sprite.frameCount
                    ? `${currentFileName} - 이미지 ${sprite.frameCount}개 로드 완료`
                    : `${currentFileName} - 이미지 ${sprite.frameCount}개 중 ${renderedCount}개 표시 (빈 이미지 ${sprite.frameCount - renderedCount}개 제외)`) + statusExtra);
                console.log(`[Log] 파일에서 이미지 추출 완료, 추출된 이미지 개수: ${sprite.frameCount}`);
            } catch (err) {
                console.error('[Log] 파일 파싱 오류:', err);
                imageContainer.innerHTML = '';
                showError(`${currentFileName}: ${err.message || '파일을 읽는 중 오류가 발생했습니다.'}`);
            }
        }

        // Decodes one frame's pixel-op stream, starting at byte offset `start`, `count`
        // 4-byte records long, into a flat RGBA buffer (raster order).
        //
        // Each record is [Alpha, Red, Green, Blue]:
        //   - Alpha == 0 (and Green == Blue == 0, per the reference decoder) is a skip
        //     run: Red holds the number of fully-transparent pixels to advance over.
        //   - Otherwise it paints exactly one pixel using the record's own alpha —
        //     there is no run-length repeat for painted pixels.
        function decompressPixels(dataView, start, count, width, height) {
            const pixels = new Uint8ClampedArray(width * height * 4);
            let pixelIndex = 0;
            let paintedPixelCommands = 0; // 압축된 칠하는 명령 수
            let skippedPixelCommands = 0; // 압축된 건너뛰는 명령 수
            let totalSkippedPixels = 0; // 건너뛴 픽셀의 총 횟수

            for (let i = 0; i < count; i++) {
                const alpha = dataView.getUint8(start + i * 4);
                const red = dataView.getUint8(start + i * 4 + 1);
                const green = dataView.getUint8(start + i * 4 + 2);
                const blue = dataView.getUint8(start + i * 4 + 3);
                console.log(`[Log] ${i + 1}번째 픽셀 Hex: ${[alpha, red, green, blue].map(b => b.toString(16).padStart(2, '0')).join(' ')}`);

                const isSkip = alpha === 0 && green === 0 && blue === 0;
                if (!isSkip) {
                    paintedPixelCommands++;
                    console.log(`[Log] ${i + 1}번째 픽셀. Alpha: ${alpha}, Red: ${red}, Green: ${green}, Blue: ${blue}`);
                    pixels[pixelIndex++] = red;
                    pixels[pixelIndex++] = green;
                    pixels[pixelIndex++] = blue;
                    pixels[pixelIndex++] = alpha;
                } else {
                    const skipCount = red;
                    skippedPixelCommands++;
                    totalSkippedPixels += skipCount;
                    console.log(`[Log] ${i + 1}번째 픽셀 건너뜀. 반복: ${skipCount}`);
                    pixelIndex += skipCount * 4;
                }
            }

            console.log(`[Log] 이미지 압축 해제 완료. 칠하는 명령 수: ${paintedPixelCommands}, 건너뛰는 명령 수: ${skippedPixelCommands}, 건너뛴 픽셀 총 횟수: ${totalSkippedPixels}`);
            pixels.isBlank = paintedPixelCommands === 0;
            return pixels;
        }

        // `pixels` is a (pixelWidth x pixelHeight) RGBA buffer painted onto a
        // (canvasWidth x canvasHeight) canvas at (offsetX, offsetY) — for S32, the
        // pixel buffer always fills the whole canvas (offset 0,0); for AGF, frames
        // are trimmed to a bounding box smaller than the full canvas. Returns the
        // canvas itself (not a data URL) so callers can also read back raw RGBA via
        // getImageData, e.g. for GIF frame capture.
        function renderFrameCanvas(pixels, pixelWidth, pixelHeight, canvasWidth, canvasHeight, offsetX, offsetY) {
            const canvas = document.createElement('canvas');
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            const ctx = canvas.getContext('2d');
            if (pixelWidth > 0 && pixelHeight > 0) {
                const imageData = ctx.createImageData(pixelWidth, pixelHeight);
                imageData.data.set(pixels);
                ctx.putImageData(imageData, offsetX, offsetY);
            }
            return canvas;
        }

        function addImageToContainer(index, imageData) {
            const div = document.createElement('div');
            div.className = 'image-item';
            div.innerHTML = `
                <input type="checkbox" id="imageCheckbox${index}">
                <label for="imageCheckbox${index}">${index}</label>
                <img src="${imageData}" alt="Image ${index}">
            `;
            const checkbox = div.querySelector('input[type="checkbox"]');
            div.addEventListener('click', (event) => {
                if (event.target === checkbox || event.target.tagName === 'LABEL') {
                    return; // native checkbox/label click already toggles + fires 'change'
                }
                checkbox.checked = !checkbox.checked;
                if (animationModeToggle.checked) {
                    updateGifPreviewForSelection();
                }
            });
            checkbox.addEventListener('change', () => {
                if (animationModeToggle.checked) {
                    updateGifPreviewForSelection();
                }
            });
            imageContainer.appendChild(div);
        }

        const DOWNLOAD_INTERVAL_MS = 300;

        function exportSelectedImages() {
            if (animationModeToggle.checked) {
                exportAnimationAsGif(true);
                return;
            }
            const checkboxes = document.querySelectorAll('.image-item input[type="checkbox"]:checked');
            checkboxes.forEach((checkbox, index) => {
                const img = checkbox.parentElement.querySelector('img');
                setTimeout(() => downloadImage(img.src, `image_${index + 1}.png`), index * DOWNLOAD_INTERVAL_MS);
            });
        }

        function exportAllImages() {
            if (animationModeToggle.checked) {
                exportAnimationAsGif(false);
                return;
            }
            const images = document.querySelectorAll('.image-item img');
            images.forEach((img, index) => {
                setTimeout(() => downloadImage(img.src, `image_${index + 1}.png`), index * DOWNLOAD_INTERVAL_MS);
            });
        }

        function downloadImage(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Builds an actual GIF only when the user exports — the live preview above
        // just cycles the original (full-quality, non-palette-quantized) frame
        // images, so this is the one place GIF-specific lossy encoding happens.
        //
        // Some AGF files bundle multiple animations (idle, walk, attack, ...) as one
        // frame sequence — when `useSelection` is true (선택한 이미지 내보내기), only
        // the checked frames go into the GIF, in their original frame order; when
        // false (전체 내보내기), every currently-shown frame is used.
        async function exportAnimationAsGif(useSelection) {
            if (!currentAnimationFrames || currentAnimationFrames.length === 0) {
                showError('GIF로 내보낼 프레임이 없습니다.');
                return;
            }

            let frames = currentAnimationFrames;
            if (useSelection) {
                const selected = getSelectedFrameIndices();
                if (selected.length === 0) {
                    showError('선택된 이미지가 없습니다. 이미지를 선택하거나 "전체 내보내기"를 사용하세요.');
                    return;
                }
                frames = selected.map(idx => currentAnimationFrames[idx]);
            }

            const frameCount = frames.length;
            showInfo(`${currentFileName} - GIF 생성 중... (${frameCount}프레임)`);
            await new Promise(resolve => setTimeout(resolve, 0)); // let the status message paint before the synchronous encode

            try {
                const gifBytes = encodeAnimatedGif(frames, currentAnimationWidth, currentAnimationHeight, GIF_FRAME_DELAY_CS);
                const blob = new Blob([gifBytes], { type: 'image/gif' });
                const url = URL.createObjectURL(blob);
                const baseName = (currentFileName || 'animation').replace(/\.(s32|agf)$/i, '');
                downloadImage(url, `${baseName}.gif`);
                showInfo(`${currentFileName} - GIF 내보내기 완료 (${frameCount}프레임)`);
            } catch (err) {
                console.error('[Log] GIF 생성 오류:', err);
                showError(`GIF 생성 중 오류가 발생했습니다: ${err.message || err}`);
            }
        }

        // ---- Minimal GIF89a encoder (median-cut palette + LZW) ----
        // No external library: builds a single global color table shared across all
        // frames (simple, at some quality cost for very color-rich animations), maps
        // alpha < 128 to one reserved transparent index, and writes GIF89a bytes by
        // hand per the spec (Logical Screen Descriptor, Global Color Table, NETSCAPE
        // looping extension, then per-frame Graphic Control Extension + Image
        // Descriptor + LZW-compressed, sub-blocked pixel data).

        function appendBytes(dest, src) {
            for (let i = 0; i < src.length; i++) dest.push(src[i]);
        }

        function u16le(n) {
            return [n & 0xff, (n >> 8) & 0xff];
        }

        // Frequency-weighted histogram of opaque colors across all frames, so the
        // quantizer works from a much smaller set than the raw pixel count.
        function collectColorHistogram(frames) {
            const counts = new Map();
            for (const rgba of frames) {
                for (let i = 0; i < rgba.length; i += 4) {
                    if (rgba[i + 3] < 128) continue;
                    const key = (rgba[i] << 16) | (rgba[i + 1] << 8) | rgba[i + 2];
                    counts.set(key, (counts.get(key) || 0) + 1);
                }
            }
            const histogram = [];
            for (const [key, count] of counts) {
                histogram.push({ r: (key >> 16) & 0xff, g: (key >> 8) & 0xff, b: key & 0xff, count });
            }
            return histogram;
        }

        // Weighted median-cut color quantization down to at most `maxColors` entries.
        function medianCutQuantize(histogram, maxColors) {
            if (histogram.length === 0) return [[0, 0, 0]];
            if (histogram.length <= maxColors) {
                return histogram.map(c => [c.r, c.g, c.b]);
            }

            let buckets = [histogram];
            let guard = 0;
            while (buckets.length < maxColors && guard++ < maxColors * 4) {
                let splitIdx = -1, splitChannel = 'r', maxRange = -1;
                for (let idx = 0; idx < buckets.length; idx++) {
                    const bucket = buckets[idx];
                    if (bucket.length < 2) continue;
                    for (const channel of ['r', 'g', 'b']) {
                        let min = Infinity, max = -Infinity;
                        for (const p of bucket) {
                            if (p[channel] < min) min = p[channel];
                            if (p[channel] > max) max = p[channel];
                        }
                        const range = max - min;
                        if (range > maxRange) { maxRange = range; splitIdx = idx; splitChannel = channel; }
                    }
                }
                if (splitIdx === -1) break;

                const bucket = buckets[splitIdx].slice().sort((a, b) => a[splitChannel] - b[splitChannel]);
                const totalCount = bucket.reduce((s, p) => s + p.count, 0);
                let acc = 0, mid = bucket.length - 2;
                for (let i = 0; i < bucket.length; i++) {
                    acc += bucket[i].count;
                    if (acc >= totalCount / 2) { mid = Math.min(i, bucket.length - 2); break; }
                }
                const left = bucket.slice(0, mid + 1);
                const right = bucket.slice(mid + 1);
                buckets.splice(splitIdx, 1, left, right);
            }

            return buckets.map(bucket => {
                let sr = 0, sg = 0, sb = 0, n = 0;
                for (const p of bucket) { sr += p.r * p.count; sg += p.g * p.count; sb += p.b * p.count; n += p.count; }
                return n > 0 ? [Math.round(sr / n), Math.round(sg / n), Math.round(sb / n)] : [0, 0, 0];
            });
        }

        function makeNearestColorFn(palette) {
            return function nearestColorIndex(r, g, b) {
                let bestIndex = 0, bestDist = Infinity;
                for (let i = 0; i < palette.length; i++) {
                    const [pr, pg, pb] = palette[i];
                    const dr = r - pr, dg = g - pg, db = b - pb;
                    const dist = dr * dr + dg * dg + db * db;
                    if (dist < bestDist) { bestDist = dist; bestIndex = i; }
                }
                return bestIndex;
            };
        }

        // Packs variable-width LZW codes into bytes, LSB-first, per the GIF spec.
        function createBitWriter() {
            const bytes = [];
            let bitBuffer = 0;
            let bitCount = 0;
            return {
                writeCode(code, size) {
                    bitBuffer |= code << bitCount;
                    bitCount += size;
                    while (bitCount >= 8) {
                        bytes.push(bitBuffer & 0xff);
                        bitBuffer >>= 8;
                        bitCount -= 8;
                    }
                },
                flush() {
                    if (bitCount > 0) {
                        bytes.push(bitBuffer & 0xff);
                        bitBuffer = 0;
                        bitCount = 0;
                    }
                },
                getBytes() {
                    return bytes;
                },
            };
        }

        // GIF-flavored LZW: dictionary keyed by comma-joined index strings, codes
        // reset via a clear code when the 12-bit dictionary fills up.
        function lzwEncode(indices, minCodeSize) {
            const clearCode = 1 << minCodeSize;
            const endCode = clearCode + 1;
            const writer = createBitWriter();

            let dict, codeSize, nextCode;
            function resetDict() {
                dict = new Map();
                for (let i = 0; i < clearCode; i++) dict.set(String(i), i);
                nextCode = endCode + 1;
                codeSize = minCodeSize + 1;
            }
            resetDict();
            writer.writeCode(clearCode, codeSize);

            let w = String(indices[0]);
            for (let i = 1; i < indices.length; i++) {
                const k = String(indices[i]);
                const wk = w + ',' + k;
                if (dict.has(wk)) {
                    w = wk;
                    continue;
                }
                writer.writeCode(dict.get(w), codeSize);
                if (nextCode < 4096) {
                    dict.set(wk, nextCode++);
                    if (nextCode > (1 << codeSize) && codeSize < 12) {
                        codeSize++;
                    }
                } else {
                    writer.writeCode(clearCode, codeSize);
                    resetDict();
                }
                w = k;
            }
            writer.writeCode(dict.get(w), codeSize);
            writer.writeCode(endCode, codeSize);
            writer.flush();
            return writer.getBytes();
        }

        // Wraps raw bytes into GIF sub-blocks: a length byte (max 255) followed by
        // that many data bytes, repeated, terminated by a zero-length block.
        function packSubBlocks(bytes) {
            const out = [];
            let i = 0;
            while (i < bytes.length) {
                const chunkLen = Math.min(255, bytes.length - i);
                out.push(chunkLen);
                for (let j = 0; j < chunkLen; j++) out.push(bytes[i + j]);
                i += chunkLen;
            }
            out.push(0);
            return out;
        }

        function encodeAnimatedGif(frames, width, height, delayCentiseconds) {
            const MAX_PALETTE_COLORS = 255; // 1 slot reserved for transparency
            const histogram = collectColorHistogram(frames);
            const paletteColors = medianCutQuantize(histogram, MAX_PALETTE_COLORS);
            const transparentIndex = paletteColors.length;
            const numColors = paletteColors.length + 1;
            const minCodeSize = Math.max(2, Math.ceil(Math.log2(numColors)));
            const colorTableSize = 1 << minCodeSize;

            const fullPalette = paletteColors.slice();
            while (fullPalette.length < colorTableSize) fullPalette.push([0, 0, 0]);

            const nearestColorIndex = makeNearestColorFn(paletteColors);

            const bytes = [];
            appendBytes(bytes, 'GIF89a'.split('').map(c => c.charCodeAt(0)));
            appendBytes(bytes, u16le(width));
            appendBytes(bytes, u16le(height));
            const gctFlag = 1, colorRes = minCodeSize - 1, sortFlag = 0, gctSizeField = minCodeSize - 1;
            bytes.push((gctFlag << 7) | (colorRes << 4) | (sortFlag << 3) | gctSizeField);
            bytes.push(0); // background color index
            bytes.push(0); // pixel aspect ratio
            for (const [r, g, b] of fullPalette) bytes.push(r, g, b);

            // Application Extension (NETSCAPE2.0): loop count 0 = infinite
            bytes.push(0x21, 0xff, 0x0b);
            appendBytes(bytes, 'NETSCAPE2.0'.split('').map(c => c.charCodeAt(0)));
            bytes.push(3, 1, 0, 0, 0);

            for (const rgba of frames) {
                // Graphic Control Extension
                bytes.push(0x21, 0xf9, 4);
                const disposalMethod = 1; // do not dispose — every frame covers the full canvas anyway
                const transparentFlag = 1;
                bytes.push((disposalMethod << 2) | transparentFlag);
                appendBytes(bytes, u16le(delayCentiseconds));
                bytes.push(transparentIndex);
                bytes.push(0);

                // Image Descriptor (always full canvas, no per-frame positioning needed)
                bytes.push(0x2c);
                appendBytes(bytes, u16le(0));
                appendBytes(bytes, u16le(0));
                appendBytes(bytes, u16le(width));
                appendBytes(bytes, u16le(height));
                bytes.push(0); // no local color table, not interlaced

                const pixelCount = width * height;
                const indices = new Uint8Array(pixelCount);
                for (let p = 0; p < pixelCount; p++) {
                    const a = rgba[p * 4 + 3];
                    indices[p] = a < 128
                        ? transparentIndex
                        : nearestColorIndex(rgba[p * 4], rgba[p * 4 + 1], rgba[p * 4 + 2]);
                }

                bytes.push(minCodeSize);
                appendBytes(bytes, packSubBlocks(lzwEncode(indices, minCodeSize)));
            }

            bytes.push(0x3b); // trailer
            return new Uint8Array(bytes);
        }
    </script>
